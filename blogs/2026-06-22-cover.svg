  <text x="1120" y="612" text-anchor="end" font-size="16" fill="#475569">2026-06-22</text>
  
  <!-- Decorative geometric element (right side) -->
  <path d="M 950 300 Q 1000 250, 1050 300 T 1050 400" fill="none" stroke="#1E3A5F" stroke-width="1.5" opacity="0.6"/>
  <circle cx="950" cy="300" r="4" fill="#1E3A5F" opacity="0.6"/>
  <circle cx="1050" cy="300" r="4" fill="#1E3A5F" opacity="0.6"/>
