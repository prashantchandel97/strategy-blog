<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" style="font-family: Inter, system-ui, -apple-system, sans-serif;">
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="630" fill="#0F172A"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#2563EB"/>
  
  <!-- Decorative texture circles -->
  <circle cx="950" cy="100" r="300" fill="#FFFFFF" opacity="0.03"/>
  <circle cx="200" cy="550" r="300" fill="#FFFFFF" opacity="0.03"/>
  
  <!-- Blog label -->
  <text x="80" y="90" font-size="13" font-weight="600" fill="#2563EB" letter-spacing="3">STRATEGY ANALYSIS</text>
  
  <!-- Title -->
  <text x="80" y="180" font-size="64" font-weight="800" fill="#FFFFFF">Governance Is the</text>
  <text x="80" y="260" font-size="64" font-weight="800" fill="#FFFFFF">New Moat</text>
  
  <!-- Divider line -->
  <line x1="80" y1="290" x2="120" y2="290" stroke="#2563EB" stroke-width="3"/>
  
  <!-- Summary -->
  <text x="80" y="340" font-size="22" fill="#94A3B8">When technology becomes infrastructure, the</text>
  <text x="80" y="375" font-size="22" fill="#94A3B8">competitive advantage shifts from building better</text>
  <text x="80" y="410" font-size="22" fill="#94A3B8">tools to deploying them with discipline.</text>
  
  <!-- Right decorative element - geometric bracket -->
  <path d="M 950 200 L 1050 200 L 1050 430 L 950 430" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
  <path d="M 970 220 L 1030 220 L 1030 410 L 970 410" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
  
  <!-- Bottom brand strip -->
  <rect x="0" y="580" width="1200" height="50" fill="#0A1628"/>
  <text x="80" y="612" font-size="16" fill="#475569">prashant-chandel.org/blog</text>
  <text x="1120" y="612" text-anchor="end" font-size="16" fill="#475569">2026-05-25</text>
</svg>