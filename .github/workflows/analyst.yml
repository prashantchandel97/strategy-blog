name: Strategy Analyst

on:
  schedule:
    - cron: '0 22 * * 1-6'   # 5 PM CDT (UTC-5) Mon-Sat
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run Analyst agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python3 .github/scripts/run_agent.py analyst

      - name: Commit analysis entry
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Analyst Bot"
          git add research/ topics.md
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "A: $(date +'%A %b %d') analyst entry" && git push
