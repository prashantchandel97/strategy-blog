name: Tweet Thread Writer

on:
  schedule:
    - cron: '0 16 * * 0'   # 11 AM CDT (UTC-5) Sunday
  workflow_dispatch:

jobs:
  tweet-thread:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Tweet Thread writer agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .github/prompts/tweet-thread.md)" \
            --allowedTools "Read,Write,Edit" \
            --model claude-sonnet-4-5 \
            --no-ansi \
            --output-format text

      - name: Commit tweet thread
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Tweet Bot"
          git add blogs/
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "Tweets: $(date +'%Y-%m-%d') thread written" && git push
