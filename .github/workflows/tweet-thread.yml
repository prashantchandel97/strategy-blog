name: Tweet Thread Writer

on:
  schedule:
    - cron: '0 16 * * 0'   # 11 AM CDT (UTC-5) Sunday
  workflow_dispatch:

jobs:
  tweet-thread:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run Tweet Thread writer agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .github/scripts/run_agent.py tweet-thread

      - name: Commit tweet thread
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Tweet Bot"
          git add blogs/
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "Tweets: $(date +'%Y-%m-%d') thread written" && git push
