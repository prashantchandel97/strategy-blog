name: Blog Compiler

on:
  schedule:
    - cron: '0 15 * * 0'   # 10 AM CDT (UTC-5) Sunday
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run Blog Compiler agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python3 .github/scripts/run_agent.py compiler

      - name: Commit blog post
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Compiler Bot"
          git add blogs/ research/ topics.md
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "Blog: $(date +'%Y-%m-%d') weekly post compiled" && git push
