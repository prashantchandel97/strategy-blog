name: Trend Scout

on:
  schedule:
    - cron: '0 4 * * 1'   # 11 PM CDT Sunday (UTC-5 = Monday 04:00 UTC)
  workflow_dispatch:        # manual trigger for testing

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Trend Scout
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python3 scout.py

      - name: Commit trends file
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Trend Scout"
          git add trends/
          git diff --staged --quiet && echo "No new trends to commit" || \
            git commit -m "Trends: $(date +'%Y-%m-%d') weekly scout" && git push
