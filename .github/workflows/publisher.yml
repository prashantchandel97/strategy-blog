name: Publisher

on:
  schedule:
    - cron: '0 17 * * 0'   # 12 PM CDT (UTC-5) Sunday
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tweepy pyyaml python-dotenv

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          N8N_API_KEY=${{ secrets.N8N_API_KEY }}
          BLOG_API_URL=https://www.prashant-chandel.org/api/n8n/posts
          TWITTER_CONSUMER_KEY=${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET=${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET=${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          EOF

      - name: Run publisher
        run: python3 publish.py

      - name: Commit publish log
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Publisher Bot"
          git add publish-log.json
          git diff --staged --quiet && echo "Nothing to log" || \
            git commit -m "Published: $(date +'%Y-%m-%d') blog + tweets" && git push
