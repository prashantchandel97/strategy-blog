name: Publisher

on:
  schedule:
    - cron: '0 17 * * 0'   # 12 PM CDT (UTC-5) Sunday
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y libcairo2-dev libffi-dev librsvg2-bin

      - name: Install dependencies
        run: pip install requests tweepy pyyaml python-dotenv cairosvg markdown

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          N8N_API_KEY=${{ secrets.N8N_API_KEY }}
          BLOG_API_URL=https://www.prashant-chandel.org/api/n8n/posts
          TWITTER_CONSUMER_KEY=${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET=${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET=${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          EOF

      # ── Step 1: Generate audio FIRST so URL is ready for blog API call ──────

      - name: Generate audio narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 audio_generator.py
        continue-on-error: true   # audio failure must not block publishing

      - name: Commit audio cache
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Publisher Bot"
          git add audio-cache.json || true
          git diff --staged --quiet && echo "No audio cache to commit" || \
            git commit -m "Audio: generated for $(date +'%Y-%m-%d')" && git pull --rebase && git push

      # ── Step 2: Publish blog + tweet thread + contrarian thread ──────────────

      - name: Run publisher
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python3 publish.py

      - name: Commit cover PNGs and publish log
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Publisher Bot"
          git add blogs/*.png publish-log.json scorecard/ || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Published: $(date +'%Y-%m-%d') blog + tweets" && git pull --rebase && git push

      # ── Step 3: Create Beehiiv newsletter draft ───────────────────────────────

      - name: Create Beehiiv newsletter draft
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
        run: python3 beehiiv_publisher.py
        continue-on-error: true   # newsletter failure must not block the rest

      - name: Commit updated publish log
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Publisher Bot"
          git add publish-log.json || true
          git diff --staged --quiet && echo "Nothing to log" || \
            git commit -m "Log: newsletter draft created $(date +'%b %d')" && git pull --rebase && git push
