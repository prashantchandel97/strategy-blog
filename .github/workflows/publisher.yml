name: Publisher

on:
  schedule:
    - cron: '0 17 * * 0'   # 12 PM CDT (UTC-5) Sunday
  workflow_dispatch:
    inputs:
      blog_file:
        description: 'Specific blog file to publish (e.g. blogs/2026-05-25-governance-is-the-new-moat.md). Leave empty to publish latest.'
        required: false
        default: ''
      post_tweets:
        description: 'Post tweet thread to X? Set to true to enable.'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y libcairo2-dev libffi-dev librsvg2-bin

      - name: Install dependencies
        run: pip install requests tweepy pyyaml python-dotenv cairosvg markdown anthropic

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          N8N_API_KEY=${{ secrets.N8N_API_KEY }}
          BLOG_API_URL=https://www.prashant-chandel.org/api/n8n/posts
          TWITTER_CONSUMER_KEY=${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET=${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET=${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          EOF

      # ── Step 1: Audio narration — PAUSED (enable when ElevenLabs plan acquired)
      # - name: Generate audio narration
      #   env:
      #     ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: python3 audio_generator.py
      #   continue-on-error: true

      # ── Step 2: Publish blog + tweet thread + contrarian thread ──────────────

      - name: Run publisher
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          BLOG_ARG=""
          TWEET_ARG="--blog-only"
          if [ -n "${{ github.event.inputs.blog_file }}" ]; then
            BLOG_ARG="--blog-file ${{ github.event.inputs.blog_file }}"
          fi
          if [ "${{ github.event.inputs.post_tweets }}" = "true" ]; then
            TWEET_ARG=""
          fi
          python3 publish.py $BLOG_ARG $TWEET_ARG

      - name: Commit cover PNGs and publish log
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Publisher Bot"
          git add blogs/*.png publish-log.json scorecard/ || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Published: $(date +'%Y-%m-%d') blog + tweets" && git pull --rebase && git push

      # ── Step 3: Generate podcast script ──────────────────────────────────────

      - name: Generate podcast script
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .github/scripts/run_agent.py podcast-script

      - name: Commit podcast script
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Publisher Bot"
          git add blogs/*-podcast-script.md || true
          git diff --staged --quiet && echo "No script to commit" || \
            git commit -m "Podcast script: $(date +'%Y-%m-%d')" && git pull --rebase && git push

      # ── Step 3: Beehiiv newsletter — PAUSED
      # Uncomment when ready to enable:
      # - name: Create Beehiiv newsletter draft
      #   env:
      #     BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
      #     BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
      #   run: python3 beehiiv_publisher.py
      #   continue-on-error: true
