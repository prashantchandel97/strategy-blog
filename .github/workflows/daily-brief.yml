name: Daily Intelligence Brief

on:
  schedule:
    - cron: '0 16 * * 1-5'   # 11 AM CDT (UTC-5) Mon-Fri — 2hrs after researcher finishes
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests pyyaml python-dotenv

      - name: Run brief-generator agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python3 .github/scripts/run_agent.py brief-generator

      - name: Commit brief file
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Brief Bot"
          git add briefs/
          git diff --staged --quiet && echo "No brief written" || \
            git commit -m "Brief: $(date +'%a %b %d')" && git pull --rebase && git push

      - name: Send brief to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 brief_generator.py

      - name: Commit send log
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Brief Bot"
          git add briefs/ || true
          git diff --staged --quiet && echo "Nothing to log" || \
            git commit -m "Log: brief sent $(date +'%b %d')" && git pull --rebase && git push
