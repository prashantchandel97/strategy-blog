name: Engagement Tracker

on:
  schedule:
    - cron: '0 19 * * 1'   # 2 PM CDT (UTC-5) every Monday — ~48h after Sunday thread posts
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy python-dotenv requests

      - name: Run engagement tracker
        env:
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python3 engagement_tracker.py

      - name: Commit analytics
        run: |
          git config user.email "strategy-bot@users.noreply.github.com"
          git config user.name "Strategy Engagement Bot"
          git add analytics/weekly/
          git diff --staged --quiet && echo "No new analytics" || \
            git commit -m "Analytics: $(date +'%b %d') engagement tracked" && git pull --rebase && git push
